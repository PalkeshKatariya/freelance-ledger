<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b5c54" />
    <meta name="description" content="A simple, private accounting tracker for Indian freelancers." />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icon.svg" />
    <link rel="stylesheet" href="styles.css" />
    <title>Freelance Ledger</title>
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="#dashboard" aria-label="Freelance Ledger home">
        <span class="brand-mark">₹</span>
        <span>Freelance Ledger</span>
      </a>
      <div class="top-actions">
        <button class="button button-quiet" id="backup-button">Backup</button>
        <button class="button button-primary" data-action="new-invoice">+ Invoice</button>
      </div>
    </header>

    <main class="app-shell">
      <aside class="sidebar" aria-label="Main navigation">
        <nav class="nav" id="navigation">
          <a href="#dashboard" data-view="dashboard" class="active"><span>⌂</span> Dashboard</a>
          <a href="#invoices" data-view="invoices"><span>▤</span> Invoices</a>
          <a href="#payments" data-view="payments"><span>✓</span> Payments</a>
          <a href="#expenses" data-view="expenses"><span>◒</span> Expenses</a>
          <a href="#clients" data-view="clients"><span>♙</span> Clients</a>
          <a href="#projects" data-view="projects"><span>□</span> Projects</a>
          <a href="#reports" data-view="reports"><span>▥</span> Reports</a>
          <a href="#settings" data-view="settings"><span>⚙</span> Settings</a>
        </nav>
      </aside>

      <section class="content" id="content" tabindex="-1"></section>
    </main>

    <nav class="mobile-nav" aria-label="Main navigation">
      <a href="#dashboard" data-view="dashboard" class="active"><span>⌂</span><small>Home</small></a>
      <a href="#invoices" data-view="invoices"><span>▤</span><small>Invoices</small></a>
      <a href="#payments" data-view="payments"><span>✓</span><small>Payments</small></a>
      <a href="#expenses" data-view="expenses"><span>◒</span><small>Expenses</small></a>
      <a href="#more" data-view="more"><span>•••</span><small>More</small></a>
    </nav>

    <div class="modal-backdrop" id="modal-backdrop" hidden>
      <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <div class="modal-header">
          <h2 id="modal-title"></h2>
          <button class="icon-button" data-action="close-modal" aria-label="Close">×</button>
        </div>
        <div id="modal-content"></div>
      </section>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <input id="import-file" type="file" accept="application/json" hidden />
    <script src="app.js"></script>
  </body>
</html>
